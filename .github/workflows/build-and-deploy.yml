# 毎朝カレンダーを取得して画像を生成し、Worker としてデプロイする。
#
# 画像は Worker のスクリプトに埋め込まれる。PNG が数KBしかないため、
# R2 や KV のようなストレージを介さない。依存サービスが減るぶん障害点も減る。
name: カレンダー画像の生成とデプロイ

on:
  schedule:
    # 端末は 0時ちょうどに起きて取りに来る。意味があるのは 0時より前に
    # 作った画像だけなので、生成は前日の夜に行う。今日と明日の2日分を作り、
    # どちらを返すかは Worker が JST の日付で判断する。
    #
    # 2回走らせるのは予備。1回目が失敗しても2回目で回復でき、
    # 端末が取りに来る 0時までに間に合う。cron は数分〜数十分遅延する。
    - cron: '0 12 * * *'   # UTC 12:00 = JST 21:00
    - cron: '0 14 * * *'   # UTC 14:00 = JST 23:00
  workflow_dispatch:

# 同時に走らせない。古い実行が新しい画像を上書きするのを防ぐ。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # npm が postinstall をブロックすると Chromium が入らず puppeteer が
      # 起動できない（このプロジェクトの開発機で実際に起きた）。
      # 依存させず明示的に取得する。
      - name: Chromium を取得
        run: npx puppeteer browsers install chrome

      - name: カレンダーを取得して画像を生成
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: node src/build.js --no-open

      - name: 生成物の確認
        run: |
          test -s dist/calendar.png || { echo "PNG が生成されていない"; exit 1; }
          test -s worker/src/image.js || { echo "画像モジュールが生成されていない"; exit 1; }
          ls -l dist/calendar.png worker/src/image.js

      - name: Worker をデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.toml
