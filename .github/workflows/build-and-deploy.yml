# 毎晩カレンダーを取得して画像を生成し、Worker としてデプロイする。
#
# 画像は Worker のスクリプトに埋め込まれる。PNG が数KBしかないため、
# R2 や KV のようなストレージを介さない。依存サービスが減るぶん障害点も減る。
name: カレンダー画像の生成とデプロイ

on:
  schedule:
    # 端末は 0時ちょうどに起きて取りに来る。意味があるのは 0時より前に
    # 作った画像だけなので、生成は前日の夜に行う。
    #
    # 毎時0分を避けているのは、GitHub が「高負荷になる時間帯には毎時0分が
    # 含まれる」と明記しており、実測でも 2〜6時間の遅延が出たため。
    # GitHub は cron の実行を保証しておらず、高負荷時にはジョブが破棄される
    # こともある。そのため夕方から深夜にかけて6回試行する。
    #
    # 早期終了は入れない。Actions の課金は1分単位の切り上げで、実行が40秒
    # 程度である以上、途中で止めても節約にならない。むしろ最後の実行まで
    # 走らせた方が、カレンダーの変更が端末に反映されるまでの時間が短い。
    - cron: '47 9 * * *'    # JST 18:47
    - cron: '47 10 * * *'   # JST 19:47
    - cron: '47 11 * * *'   # JST 20:47
    - cron: '47 12 * * *'   # JST 21:47
    - cron: '47 13 * * *'   # JST 22:47
    - cron: '47 14 * * *'   # JST 23:47
  workflow_dispatch:

# 同時に走らせない。古い実行が新しい画像を上書きするのを防ぐ。
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # npm が postinstall をブロックすると Chromium が入らず puppeteer が
      # 起動できない（このプロジェクトの開発機で実際に起きた）。
      # 依存させず明示的に取得する。
      - name: Chromium を取得
        run: npx puppeteer browsers install chrome

      - name: カレンダーを取得して画像を生成
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: node src/build.js --no-open

      - name: 生成物の確認
        run: |
          test -s dist/calendar.png || { echo "PNG が生成されていない"; exit 1; }
          test -s worker/src/image.js || { echo "画像モジュールが生成されていない"; exit 1; }
          ls -l dist/calendar.png worker/src/image.js

      # wrangler は成功時にデプロイ先 URL を標準出力に出す。そこに含まれる
      # workers.dev のサブドメインは Secrets ではないため既定では伏せられず、
      # 公開リポジトリでは実行ログからそのまま読める。add-mask で登録しておく。
      # （API トークンとアカウントIDは Secrets なので自動で伏せられる）
      - name: Worker をデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: |
          if [ -n "$WORKERS_SUBDOMAIN" ]; then echo "::add-mask::$WORKERS_SUBDOMAIN"; fi
          npx wrangler deploy --config worker/wrangler.toml
