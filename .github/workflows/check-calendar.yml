# カレンダーの共有が成功したかを手動で確認する。
# 実家など手元にPCが無い場所から、スマホのブラウザで実行してログを読む用途。
#
# カレンダーIDは入力ではなく Secrets から渡す。入力にすると、値が実行コマンドと
# 実行画面の両方に残り、公開リポジトリではそれがそのまま公開されるため
# （Secrets ならログ上で伏せられる）。スマホから長いIDを打たずに済む利点もある。
name: カレンダー共有の確認

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 確認には puppeteer / Chromium が不要なので、
      # install スクリプトを止めて Chromium のダウンロードを省く
      - run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: 共有を確認
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: node src/check.js
