# reTerminal E1001 — 実家向けカレンダー表示端末
#
# 画像は Cloudflare Worker（image_url）から取得し、JST 00:30 を目標に deep_sleep
# から起床して描画する（RTC ドリフトのマージンを見て 00:00 ちょうどからずらした）。
# 緑ボタン（EXT0）で起こしたときは2分の保守モードに入り、ファームウェアも
# http_request OTA で遠隔から更新できる
# （worker-fw/ 側。npm run push-firmware → 端末が次の起動時に自動で取得）。
# 詳しい経緯は DECISIONS.md 参照。
#
# ピン配置の出典: https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome/

substitutions:
  name: family-calendar
  image_url: "https://family-calendar.<your-subdomain>.workers.dev/cal"
  fw_base: "https://family-calendar-fw.<your-subdomain>.workers.dev"

esphome:
  name: ${name}
  friendly_name: 家族カレンダー
  # lambda から esp_sntp_set_time_sync_notification_cb を使うため
  includes:
    - sntp_status.h
  platformio_options:
    # この個体は CH340K の USB-UART ブリッジを UART0 で使っており、
    # macOS のドライバとの組み合わせで 460800 以上だと連続転送が壊れる。
    # esphome の既定値は速すぎるので明示的に落とす。
    upload_speed: 230400
  on_boot:
    # 電池電圧の分圧回路を最優先で入れる。読むのは後（-100 の中）なので、
    # その間に電圧が安定する。
    - priority: 600
      then:
        - output.turn_on: battery_enable

    - priority: -100
      then:
      - lambda: |-
          ESP_LOGI("wake", "起床要因: %d", (int) esp_sleep_get_wakeup_cause());

          // **SNTP の本物の同期通知を自分で受ける。**
          // ESP-IDF がサーバから応答を受け取ったときにしか呼ばれないので、
          // 時計の妥当性を見る判定が入り込む余地がない。ESPHome が setup で
          // 登録したものを上書きするが、失われるのは当てにできないと分かった
          // on_time_sync と「Synchronized time」のログだけ。
          esp_sntp_set_time_sync_notification_cb([](struct timeval *tv) {
            time_synced->value() = true;
          });

      # 電池残量を測る。Wi-Fi より前に済ませておく。回線が不調でも残量だけは
      # 画面に出したいため（電池切れが近いことは、予定より先に知りたい）。
      - component.update: battery_voltage
      - component.update: battery_level
      - lambda: |-
          ESP_LOGI("battery", "電池: %.2f V / %.0f%%",
                   id(battery_voltage).state, id(battery_level).state);

      # 緑ボタンで起きたときだけ鳴らす。通常の 00:00 起床では鳴らさない
      # （夜中に音を立てない。誰も聞いていないので意味も無い）。
      #
      # **Wi-Fi より前に鳴らすことに意味がある。** ここで鳴れば「電源が入って
      # いて起動した」ことがネットワークと無関係に確定する。電話で
      # 「押したらピッと鳴った?」と聞けば、無反応の原因が端末側か回線側かを
      # 切り分けられる。画面のチカチカだけだと、Wi-Fi が落ちているときも
      # 電池切れのときも同じ「無反応」になって区別がつかない。
      #
      - if:
          condition:
            lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0;'
          then:
            - logger.log: "緑ボタンでの起床。ブザーを鳴らします"
            # duty 50% が矩形波として最も音が大きい
            - output.set_level: { id: buzzer, level: 50% }
            - delay: 80ms
            - output.turn_off: buzzer

      # Wi-Fi が繋がるまで待ってから取りに行く
      - wait_until:
          condition: wifi.connected
          timeout: 60s

      # **本物の同期を待つ。値の妥当性（is_valid）では足りない。**
      # is_valid() は「値の範囲が妥当か」しか見ないので、10分ずれた時刻も通す。
      # 詳しくは globals の time_synced のコメント参照。
      #
      # 以前は finish（画像取得後）で待っていたが、下の早期判定に時刻が要るため
      # ここに引き上げた。
      - wait_until:
          condition:
            lambda: 'return id(time_synced);'
          timeout: 60s

      # ------------------------------------------------------------------
      # ターゲットは 00:00 ちょうどではなく 00:30（script sleep_until_next 参照）。
      # ただし ESP32 の deep_sleep タイマーは内蔵 RC 発振器を使うため数%ドリフトし、
      # 実測で 24時間睡眠につき約10分早まる。00:30 のマージンを超えて早まり、
      # まだ日付が変わる前（23時台）に起きてしまうことがある。
      #
      # この状態で画像取得やファーム確認を進めても、次に起きるのはさらに
      # 24時間後になってしまう可能性がある（今日の分の処理はできるが、翌日分の
      # 処理をもう一度素早くやり直す機会を逃す）。「日付が変わったか」を明示的に
      # 判定し、変わっていなければ何もせず眠り直す。
      #
      # 判定基準は expected_midnight_ts（sleep_until_next が眠る直前に計算・保存
      # する、「次に迎えるべき日付の 00:00:00」のタイムスタンプ）。実際の起床時刻
      # ではなく保存済みの目標と比較するので、10分早くても30日後でも正しく動く。
      # sleep_duration の保険経路（globals の初期値 0 のまま）や電源断からの復帰
      # （起床要因が TIMER でない）ではこの判定自体を通らないため、通常どおり
      # 処理が進む。
      - if:
          condition:
            lambda: |-
              return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER
                  && id(time_synced) && id(jst).now().is_valid()
                  && (time_t) id(jst).now().timestamp < (time_t) id(expected_midnight_ts);
          then:
            - logger.log: "定期起床ですが、まだ日付が変わっていません。00:30 を狙って眠り直します"
            - lambda: 'esp_ota_mark_app_valid_cancel_rollback();'
            - script.execute: sleep_until_next
          else:
            # ------------------------------------------------------------------
            # ファームウェアの確認は**画像取得より先に**行う。
            #
            # 回復手段が回復対象に依存してはいけないため。トークンを交換したり画像の
            # URL を変えたりした場合、古いファームは画像を取得できない。
            # 「画像取得 → 失敗で就寝」という順序だとここに到達せず、端末が永久に
            # 更新を受け付けなくなる。実家まで USB を持って行く以外に手がなくなる。
            - script.execute: check_firmware
            - wait_until:
                condition:
                  lambda: 'return !id(check_firmware).is_running();'
                timeout: 30s
            # ------------------------------------------------------------------

            # component.update は非同期。ここで眠らせると取得・描画の前に落ちるので、
            # 眠る判断は online_image の on_download_finished / on_error から呼ぶ。
            - component.update: calendar_image

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # 32MB フラッシュで OTA を使うには ESP-IDF の実験的機能の有効化が要る。
      # OTA を諦める選択肢もあるが、設置後は実家まで車で1時間以内とはいえ出向く手間が大きいため、
      # Wi-Fi 経由で更新できる手段は残しておく。
      enable_idf_experimental_features: true

# ESP32-S3R8 は 8MB の octal PSRAM。800x480 の画像バッファ用に有効化する。
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  # 同一LAN 用。自宅で開発している間はこちらが速い。
  - platform: esphome
    password: !secret ota_password
  # 端末側から取りに行く方式。実家に設置したあとはこちらしか届かない。
  - platform: http_request
    id: fw_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 2.4GHz 専用機（技適の認証範囲も 2412〜2472MHz のみ）
  ap:
    ssid: "${name} setup"
    password: !secret fallback_password

captive_portal:

# 描画が終わったあとの締めくくり。取得の成否どちらからも呼ぶ。
# mode: single なので二重に呼ばれても1回しか走らない。
script:
  # 配信中のビルド時刻を見て、自分と違えば書き込む。
  #
  # 判定にビルド時刻を使うのは、ESPHome がそれをバイナリに焼き込んでおり
  # **端末が自分の値を知っている**から。MD5 を焼き込もうとすると、焼き込んだ
  # 時点で MD5 が変わるので循環して成立しない。書き込み後の新しいファームは
  # 配信中の値と一致するため、二度目以降は何もしない。
  #
  # 通常時は数十バイトの GET が1回増えるだけで、起床時間は1〜2秒伸びる。
  # 画像と同じ経路に相乗りさせればこれは省けるが、画像側が壊れたときに
  # 更新も届かなくなるので分けている。
  - id: check_firmware
    mode: single
    then:
      - logger.log: "配信中のファームウェアを確認します"
      - http_request.get:
          url: ${fw_base}/fw.version
          request_headers:
            Authorization: !secret fw_authorization_header
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("fw", "確認できませんでした (HTTP %d)", response->status_code);
                    id(fw_status) = "確認できず(HTTP " + std::to_string(response->status_code) + ")";
                    return;
                  }
                  char mine[App.BUILD_TIME_STR_SIZE];
                  App.get_build_time_string(mine);
                  std::string theirs = body;
                  // 末尾の改行や空白を落としてから比べる
                  while (!theirs.empty() && (theirs.back() == '\n' || theirs.back() == '\r' ||
                                             theirs.back() == ' ')) {
                    theirs.pop_back();
                  }
                  if (theirs == mine) {
                    ESP_LOGI("fw", "最新です (%s)", mine);
                    id(fw_status) = std::string("最新 ") + mine;
                    return;
                  }
                  ESP_LOGI("fw", "更新があります: %s -> %s", mine, theirs.c_str());
                  id(fw_status) = std::string("更新あり ") + mine + " -> " + theirs;
                  id(fw_update_needed) = true;
          on_error:
            then:
              # 確認できなくても画面は出す。ここで止める方が害が大きい。
              - logger.log: "ファームウェアの確認に失敗しました。今回は見送ります"
              - globals.set: { id: fw_status, value: '"取得失敗"' }
      - if:
          condition:
            lambda: 'return id(fw_update_needed);'
          then:
            - logger.log: "書き込みます。完了すると再起動します"
            - ota.http_request.flash:
                id: fw_ota
                url: ${fw_base}/fw.bin
                md5_url: ${fw_base}/fw.md5
                username: !secret fw_user
                password: !secret fw_password
            # 成功していれば再起動しているので、ここに来たのは失敗したとき。
            - logger.log: "書き込みに失敗しました。次の起床でやり直します"
            - globals.set: { id: fw_status, value: '"書き込み失敗"' }

  - id: finish
    mode: single
    then:
      # on_boot 時点のログは読めないので、ここでもう一度出す。
      - lambda: 'ESP_LOGI("fw", "ファームウェア: %s", id(fw_status).c_str());'
      # 緑ボタンで起きたときだけ起きたままにする（保守モード）。
      # 通常の 00:00 起床は描画が済めば用が無いので即座に眠る。
      - if:
          condition:
            lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0;'
          then:
            - logger.log: "保守モード: 2分間起きたままにします"
            - delay: 2min
      # OTA のロールバック対策。
      #
      # ESP-IDF は CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y で動いており、OTA 直後の
      # ファームは「未確認」状態にある。ESPHome は safe_mode が起動から60秒後に
      # esp_ota_mark_app_valid_cancel_rollback() を呼んで確定させるが、この端末は
      # 通常30秒未満で眠るのでその時刻に到達しない。結果、次の起動でブートローダが
      # 前のファームに巻き戻す。OTA は「成功」と出るのに更新が入らない。
      #
      # ここまで到達したこと自体が「起動から就寝判断まで一通り走った」証拠なので、
      # 確定の条件として十分。途中でクラッシュすればここには来ず、巻き戻しが効く。
      - lambda: 'esp_ota_mark_app_valid_cancel_rollback();'

      # time_synced の待機は on_boot 側（Wi-Fi 接続直後）に引き上げ済み。
      # ここまで来ているなら、同期できているかの結果は出ている。
      - if:
          condition:
            lambda: 'return id(time_synced) && id(jst).now().is_valid();'
          then:
            - script.execute: sleep_until_next
          else:
            # Wi-Fi や NTP の一時的な不調を想定。1時間後に起きてやり直す。
            - logger.log: "時刻を取得できませんでした。1時間後にやり直します"
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: 1h

  # 次の定期起床を予約して眠る。on_boot の早期リターンと finish の両方から呼ぶ。
  #
  # ターゲットは 00:00 ちょうどではなく 00:30。deep_sleep のタイマー（内蔵 RC
  # 発振器、実測で 24時間につき約10分ドリフト）が早まる方向にずれても、日付が
  # 変わったあとに着地するようマージンを取っている。
  #
  # 同時に、次に起きたとき「日付が変わったか」を判定するための基準時刻
  # （expected_midnight_ts）を計算して保存する。判定用の基準はあくまで
  # 00:00:00 であり、スリープの目標（00:30）とは別物。00:30 をそのまま判定に
  # 使うと「00:30 に届いたか」を見てしまい、23:50 起床でも 00:00 起床でも同じ
  # 「失敗」と判定されて、単に起床を遅らせただけになってしまう。
  - id: sleep_until_next
    mode: single
    then:
      - lambda: |-
          auto now = id(jst).now();
          auto midnight = now;
          midnight.hour = 0;
          midnight.minute = 0;
          midnight.second = 0;
          midnight.recalc_timestamp_utc();
          time_t midnight_ts = midnight.timestamp - esphome::ESPTime::timezone_offset();
          if (midnight_ts <= now.timestamp) {
            midnight_ts += 24 * 3600;  // 今日の 00:00 はもう過ぎている
          }
          id(expected_midnight_ts) = (int32_t) midnight_ts;
          ESP_LOGI("sleep", "次回の判定基準(次の00:00): %d", (int) midnight_ts);
      - logger.log:
          format: "次の JST 00:30 まで眠ります（電池 %.0f%%）"
          args: ['id(battery_level).state']
      - deep_sleep.enter:
          id: sleeper
          until: '00:30:00'
          time_id: jst

globals:
  # SNTP が**ネットワークから応答を受け取って**時刻を直したか。
  #
  # ESPHome の on_time_sync は使えない。ESP32 では2つの経路から発火し、片方は
  # sntp_component.cpp の loop で now().is_valid() を見るだけなので、deep sleep
  # 復帰時の推定時刻（スリープ前の時刻＋スリープ時間）でも真になる。推定値には
  # RTC のずれがそのまま乗っている。
  #
  # 実際に起きた事象（2026-09-03）: 13時間半の就寝で RTC が約10分進み、実際の
  # 23:50 に「00:00 になった」と判断して起床。ずれた時刻で「次の 00:00」を計算した
  # 結果 +24時間 眠り込み、画面が丸一日止まった。
  - id: time_synced
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: fw_update_needed
    type: bool
    # 起床のたびに判定し直すので NVS に残す必要はない。
    restore_value: no
    initial_value: 'false'

  # 確認の結果を控えておき、就寝前にもう一度ログへ出す。
  # ファーム確認は on_boot の中で esphome logs が接続する前に終わるため、
  # その場のログは読めない。見えない成功は信用できないので、後から読める
  # ところへ残しておく。
  - id: fw_status
    type: std::string
    restore_value: no
    initial_value: '"未確認"'

  # 「次に迎えるべき日付の 00:00:00」の UTC タイムスタンプ。定期起床のたびに
  # sleep_until_next が更新し、次の on_boot がこれと現在時刻を比較して、まだ
  # 日付が変わっていない早期起床かどうかを判定する。
  #
  # **deep_sleep を越えて残す必要があるので restore_value: yes。** NVS に保存
  # され、deep_sleep.enter が呼ぶ App.run_safe_shutdown_hooks() のタイミングで
  # 確実に書き込まれる。
  #
  # 電源が完全に落ちた場合（電池切れ等）はこの値も失われうるが、その場合の
  # 復帰は起床要因が電源投入/リセットになり、この判定自体を通らないので
  # 実害はない。初期値 0（1970年）でも「現在時刻 >= 0」は常に真になるだけ
  # なので、初回起動時に誤って早期リターンする心配もない。
  - id: expected_midnight_ts
    type: int32_t
    restore_value: yes
    initial_value: '0'

# until: で次の 00:00 までの秒数を計算するのに使う。
# 起床のたびに同期し直すので、固定時間スリープのようなずれの蓄積が起きない。
time:
  - platform: sntp
    id: jst
    timezone: Asia/Tokyo
    servers:
      - ntp.nict.jp
      - pool.ntp.org

# ------------------------------------------------------------------
# ここから調整用。設置前に削除する。
# 眠っている端末は HTTP を受けられないため、本来の運用とは両立しない。
#
# api は Home Assistant 用ではなく、esphome logs が Wi-Fi 経由で
# ログを読むための経路として入れている。これが無いと USB を挿さない限り
# ログが一切見えず、ボタンや deep_sleep の不具合を切り分けられない。
# deep_sleep はもう入っているが、設置直前まではあえて残してある。
api:
  encryption:
    key: !secret api_encryption_key
  # on_boot のログは esphome logs が繋がる前に流れてしまい読めない。
  # on_client_connected も接続の瞬間に発火するため、クライアントがログの購読を
  # 登録し終える前で、やはり間に合わなかった。少し待ってから出す。
  on_client_connected:
    - delay: 3s
    - lambda: |-
        ESP_LOGI("wake", "起床要因: %d  (0=電源投入/リセット 2=GPIO 4=タイマー)",
                 (int) esp_sleep_get_wakeup_cause());

# レイアウト調整のたびに USB を挿し直すのを避けるための仕組み。
# Worker に新しい画像をデプロイしたあと、Mac から
#   curl -u admin:<web_password> -X POST http://family-calendar.local/button/refresh/press
# を叩けば、その場で取り直して描画する。
web_server:
  port: 80
  # 実家のLANに無認証の操作画面を残さないよう、消し忘れへの保険を掛けておく
  auth:
    username: admin
    password: !secret web_password

button:
  - platform: template
    name: refresh
    id: refresh_image
    on_press:
      - logger.log: "手動で再取得します"
      - component.update: calendar_image

# 本体上部の3つのボタン。実機で押して対応を確定済み:
#   GPIO3 = 🔄（緑）  GPIO4 = ←  GPIO5 = →
# Seeed の Wiki は左右を位置で書いているが実物の刻印とは逆だったので、
# 刻印されている矢印そのものを名前にしている。
# 🔄 は刻印どおり画像の再取得に割り当てた。
#
# 名前を英字にしているのは、ESPHome が名前から ASCII の識別子を作るため。
# 日本語だけの名前は全て同じ識別子に潰れて衝突する。
#
# GPIO3 は strapping ピン（起動時のブートモード決定に使われる）で警告が出る。
# 入力として読むだけなら実害はないが、deep_sleep の起床ピンに使えるかは
# 実機で確認する。
binary_sensor:
  - platform: gpio
    name: "Button Green"
    id: btn_green
    # deep_sleep の wakeup_pin と同じピンを共有するので明示的に許可する
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    # 取得は on_boot が行うので、ここで component.update は呼ばない。
    # 呼ぶと連打のたびに再取得と全画面リフレッシュ（約6秒）が走り、電池を無駄に
    # 使う。押して起こす → on_boot が取りに行く、で用は足りている。
    on_press:
      - logger.log: "緑ボタンが押されました"
  - platform: gpio
    name: "Button Left"
    id: btn_left
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "←ボタンが押されました"
  - platform: gpio
    name: "Button Right"
    id: btn_right
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "→ボタンが押されました"
# ------------------------------------------------------------------
# 起床時刻は script sleep_until_next の deep_sleep.enter が毎回決める。
# on_boot の早期リターン（まだ日付が変わっていない）と finish（通常の就寝）の
# 両方がこの script を呼ぶので、眠る場所は実質ここ1箇所に集約されている。
# 下の run_duration と sleep_duration はどちらも保険。
#
# run_duration: script が呼ばれないまま固まったときに必ず眠らせる上限。
#   通常は約15秒（早期リターン時はさらに短い）、保守モードでも約2分半で
#   script が眠らせるので普段は発火しない。短くすると取得や描画の途中で
#   切られるため、あえて余裕を持たせる。
# sleep_duration: その保険経路で眠るときの時間。until が使えていないので、
#   1時間後に起こして通常の流れをやり直させる。
#
# **緑ボタンはどんなファームを焼いても必ず戻ってこられる入口になる。**
# 新しいファームに不具合があっても、押せば必ず2分の作業窓が開く。
# 保守モードの長さは script finish 側で決めている。
deep_sleep:
  id: sleeper
  run_duration: 5min
  sleep_duration: 1h
  wakeup_pin:
    number: GPIO3
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  # 就寝の瞬間に緑ボタンが押されていた場合、起床条件を「離したとき」に反転させる。
  #
  # 既定の IGNORE だと押されたまま眠った直後に EXT0 が即発火し、
  # 起床 → 取得 → 描画 → 2分 → 就寝 → 即起床 を離すまで繰り返す。
  # 2分ごとに全画面リフレッシュが走り続けるので電池がすぐ空になる。
  # 棚に置いた本が寄りかかる程度のことで起こりうる。
  #
  # KEEP_AWAKE は離すまで起きたまま待つので、押しっぱなしの間ずっと電力を
  # 使い続ける。無人で3ヶ月もたせる用途では最悪の選択。
  #
  # 押されていない通常時の挙動は IGNORE と同じなので副作用は無い。
  wakeup_pin_mode: INVERT_WAKEUP

# online_image が画像を取りに行くための HTTP クライアント
http_request:
  useragent: esphome/family-calendar
  timeout: 30s
  # 本番で https を使う場合に CA を積まずに済ませるため検証を切る。
  # 配信URLは秘密トークン付きで、内容も家族の予定であるため許容範囲と判断。
  verify_ssl: false

# 本体のブザー（パッシブ型なので PWM で駆動する）。
#
# 周波数が音程になる。圧電ブザーは 2〜4kHz が最も大きく鳴るが、母の耳は
# 遠くないとのことなので効率を追う必要は無く、Seeed の作例と同じ 1000Hz にする。
# 実機で小さすぎるようなら周波数を上げると大きくなる。
output:
  - platform: ledc
    pin: GPIO45
    id: buzzer
    frequency: 1000Hz

  # 電池電圧の分圧回路を有効にするピン。常時有効だと電池を食うので、
  # 測るときだけ入れる（下の on_boot で起動直後に入れている）。
  - platform: gpio
    pin: GPIO21
    id: battery_enable

# 電池残量。実家に置く装置で「いつの間にか電池切れ」は最も避けたい失敗なので、
# 画面に出して気づけるようにする。**サーバは電池の状態を知りようがないので、
# 端末側で描くこの仕組みが唯一の方法。**
#
# Seeed の作例は update_interval で定期的に測る形だが、この端末は約15秒で眠るため
# それだと一度も測らないまま就寝する。never にして起床時に明示的に測る。
sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    attenuation: 12db
    update_interval: never
    filters:
      # 分圧されているので倍に戻す
      - multiply: 2.0

  - platform: template
    id: battery_level
    update_interval: never
    lambda: 'return id(battery_voltage).state;'
    filters:
      # リチウムイオン電池の電圧は残量に対して直線的でないため、実測に基づく
      # 折れ線で対応づける（値は Seeed の作例）。
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

# 画面右上に重ねる小さな情報表示用。
#
# **TTF ではなくビットマップフォント（BDF）を使う。** 本文用の書体を小さく縮めると
# 1bit 化で線が飛んだり潰れたりするが、BDF は特定のピクセルサイズ用に字形が一点ずつ
# 設計されているため縮小も補間も起きない。Terminus は小さいサイズでの可読性のために
# 作られた書体で、この用途に最も適している。b はボールドで、細い方より ePaper に残る。
#
# glyphs を絞ると焼き込まれる字形が減る。数字と記号だけなので数KBで済む。
font:
  # 左上のファーム版。診断のときしか読まないので小さくてよい。
  - file: "../assets/fonts/ter-u12b.bdf"
    id: version_font
    glyphs: "0123456789-"

  # 右上の電池残量。母が日常的に見る情報なので一回り大きくする。
  # 16px は右上の余白（実測 20px）に収まる上限で、18px 以上だと
  # 「今後の予定」の見出しに接触する。
  - file: "../assets/fonts/ter-u16b.bdf"
    id: battery_font
    glyphs: "0123456789-%"

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

online_image:
  - id: calendar_image
    url: ${image_url}
    # トークンはヘッダで送る。クエリ文字列だと URL ごとログに残るため。
    request_headers:
      Authorization: !secret authorization_header
    format: PNG
    # サーバ側で1bitに落としてあるので BINARY で受ける
    type: BINARY
    resize: 800x480
    update_interval: never
    on_download_finished:
      - logger.log: "画像を取得しました。描画します。"
      - component.update: epaper
      - script.execute: finish
    on_error:
      # 取得できなくても眠らせる。画面は前回の内容が残る（ePaper なので消えない）。
      - logger.log: "画像の取得に失敗しました。"
      - script.execute: finish

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # 描画は画像取得後に明示的に行う
    update_interval: never
    lambda: |-
      // 描画色と背景色を入れ替えて渡す。
      // サーバは「白地に黒文字」の人間が読める向きで PNG を出しており、
      // 1bit パレットPNG のどちらのインデックスをインクとみなすかが
      // ePaper ドライバ側と一致しないため、ここで吸収する。
      // サーバ側を negate すると shots の出力や印刷用の画像まで
      // 白黒反転してしまうので、機器の都合は表示側で引き受ける。
      it.image(0, 0, id(calendar_image), COLOR_OFF, COLOR_ON);

      // 端末しか知らない情報を画面の両上端に重ねる。
      // サーバが作る PNG には書けない情報なので、端末側で描くしかない。
      //
      // **電池残量は右上。** スマートフォンが右上に出すので、母は説明されなくても
      // 意味を察せる。慣れた場所に慣れたものを置くという判断で、画面全体の方針
      //（説明を要さないこと）と一致している。版は反対側の左上に離す。
      //
      // サーバ側の上端の余白は左 30px・右 20px（dist の PNG で実測）。
      // 12px の文字を y=2 に置けばどちらとも重ならない。
      char bt[esphome::Application::BUILD_TIME_STR_SIZE];
      App.get_build_time_string(bt);
      char version[16];
      // ビルド時刻を YYMMDD-HHMM に縮める
      // "2026-09-02 09:00:58 +0900" → "260902-0900"
      //
      // 年を入れているのは、実家に置いたあと1年以上更新しないことが十分あり得る
      // ため。月日だけだと何年のものか分からなくなる。
      snprintf(version, sizeof(version), "%c%c%c%c%c%c-%c%c%c%c",
               bt[2], bt[3], bt[5], bt[6], bt[8], bt[9],
               bt[11], bt[12], bt[14], bt[15]);
      it.print(4, 2, id(version_font), COLOR_ON, TextAlign::TOP_LEFT, version);

      // 測れていない場合は数字を出さない（0% と出すと誤解を招く）。
      char battery[8];
      if (std::isnan(id(battery_level).state)) {
        snprintf(battery, sizeof(battery), "--%%");
      } else {
        snprintf(battery, sizeof(battery), "%.0f%%", id(battery_level).state);
      }
      it.print(796, 2, id(battery_font), COLOR_ON, TextAlign::TOP_RIGHT, battery);
