# reTerminal E1001 — 実家向けカレンダー表示端末
#
# 検証段階の構成。deep_sleep はまだ入れていない。
# 確かめたいのは次の2点:
#   1. online_image が Seeed の ePaper で動くか（Wiki には file: の例しかない）
#   2. 実機で文字が読めるか
#
# 画像はクラウドではなく同一LAN上の Mac から取得する。
# 配信インフラを作る前に、端末側が動くことを先に確かめるため。
#
# ピン配置の出典: https://wiki.seeedstudio.com/reterminal_e10xx_with_esphome/

substitutions:
  name: family-calendar
  image_url: "https://family-calendar.<your-subdomain>.workers.dev/cal"

esphome:
  name: ${name}
  friendly_name: 家族カレンダー
  platformio_options:
    # この個体は CH340K の USB-UART ブリッジを UART0 で使っており、
    # macOS のドライバとの組み合わせで 460800 以上だと連続転送が壊れる。
    # esphome の既定値は速すぎるので明示的に落とす。
    upload_speed: 230400
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("wake", "起床要因: %d", (int) esp_sleep_get_wakeup_cause());
      # Wi-Fi が繋がるまで待ってから取りに行く
      - wait_until:
          condition: wifi.connected
          timeout: 60s
      # component.update は非同期。ここで眠らせると取得・描画の前に落ちるので、
      # 眠る判断は online_image の on_download_finished / on_error から呼ぶ。
      - component.update: calendar_image

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      # 32MB フラッシュで OTA を使うには ESP-IDF の実験的機能の有効化が要る。
      # OTA を諦める選択肢もあるが、設置後は実家まで車で1時間以内とはいえ出向く手間が大きいため、
      # Wi-Fi 経由で更新できる手段は残しておく。
      enable_idf_experimental_features: true

# ESP32-S3R8 は 8MB の octal PSRAM。800x480 の画像バッファ用に有効化する。
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 2.4GHz 専用機（技適の認証範囲も 2412〜2472MHz のみ）
  ap:
    ssid: "${name} setup"
    password: !secret fallback_password

captive_portal:

# 描画が終わったあとの締めくくり。取得の成否どちらからも呼ぶ。
# mode: single なので二重に呼ばれても1回しか走らない。
script:
  - id: finish
    mode: single
    then:
      # 緑ボタンで起きたときだけ起きたままにする（保守モード）。
      # 通常の 00:00 起床は描画が済めば用が無いので即座に眠る。
      - if:
          condition:
            lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0;'
          then:
            - logger.log: "保守モード: 2分間起きたままにします"
            - delay: 2min
      # SNTP が同期していないと now() は1970年を返し、until: が出鱈目な秒数を
      # 算出してしまう。数ヶ月眠り込みかねないので必ず有効性を確かめる。
      - wait_until:
          condition:
            lambda: 'return id(jst).now().is_valid();'
          timeout: 60s
      - if:
          condition:
            lambda: 'return id(jst).now().is_valid();'
          then:
            - logger.log: "次の JST 00:00 まで眠ります"
            - deep_sleep.enter:
                id: sleeper
                until: '00:00:00'
                time_id: jst
          else:
            # Wi-Fi や NTP の一時的な不調を想定。1時間後に起きてやり直す。
            - logger.log: "時刻を取得できませんでした。1時間後にやり直します"
            - deep_sleep.enter:
                id: sleeper
                sleep_duration: 1h

# until: で次の 00:00 までの秒数を計算するのに使う。
# 起床のたびに同期し直すので、固定時間スリープのようなずれの蓄積が起きない。
time:
  - platform: sntp
    id: jst
    timezone: Asia/Tokyo
    servers:
      - ntp.nict.jp
      - pool.ntp.org

# ------------------------------------------------------------------
# ここから調整用。deep_sleep を入れる段階でまとめて削除する。
# 眠っている端末は HTTP を受けられないため両立しない。
#
# api は Home Assistant 用ではなく、esphome logs が Wi-Fi 経由で
# ログを読むための経路として入れている。これが無いと USB を挿さない限り
# ログが一切見えず、ボタンや deep_sleep の不具合を切り分けられない。
api:
  encryption:
    key: !secret api_encryption_key
  # on_boot のログは esphome logs が繋がる前に流れてしまい読めない。
  # on_client_connected も接続の瞬間に発火するため、クライアントがログの購読を
  # 登録し終える前で、やはり間に合わなかった。少し待ってから出す。
  on_client_connected:
    - delay: 3s
    - lambda: |-
        ESP_LOGI("wake", "起床要因: %d  (0=電源投入/リセット 2=GPIO 4=タイマー)",
                 (int) esp_sleep_get_wakeup_cause());

# レイアウト調整のたびに USB を挿し直すのを避けるための仕組み。
# Worker に新しい画像をデプロイしたあと、Mac から
#   curl -u admin:<web_password> -X POST http://family-calendar.local/button/refresh/press
# を叩けば、その場で取り直して描画する。
web_server:
  port: 80
  # 実家のLANに無認証の操作画面を残さないよう、消し忘れへの保険を掛けておく
  auth:
    username: admin
    password: !secret web_password

button:
  - platform: template
    name: refresh
    id: refresh_image
    on_press:
      - logger.log: "手動で再取得します"
      - component.update: calendar_image

# 本体上部の3つのボタン。実機で押して対応を確定済み:
#   GPIO3 = 🔄（緑）  GPIO4 = ←  GPIO5 = →
# Seeed の Wiki は左右を位置で書いているが実物の刻印とは逆だったので、
# 刻印されている矢印そのものを名前にしている。
# 🔄 は刻印どおり画像の再取得に割り当てた。
#
# 名前を英字にしているのは、ESPHome が名前から ASCII の識別子を作るため。
# 日本語だけの名前は全て同じ識別子に潰れて衝突する。
#
# GPIO3 は strapping ピン（起動時のブートモード決定に使われる）で警告が出る。
# 入力として読むだけなら実害はないが、deep_sleep の起床ピンに使えるかは
# 実機で確認する。
binary_sensor:
  - platform: gpio
    name: "Button Green"
    id: btn_green
    # deep_sleep の wakeup_pin と同じピンを共有するので明示的に許可する
    pin: { number: GPIO3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    on_press:
      - logger.log: "緑ボタンが押されました → 画像を再取得します"
      - component.update: calendar_image
  - platform: gpio
    name: "Button Left"
    id: btn_left
    pin: { number: GPIO4, mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "←ボタンが押されました"
  - platform: gpio
    name: "Button Right"
    id: btn_right
    pin: { number: GPIO5, mode: INPUT_PULLUP, inverted: true }
    on_press:
      - logger.log: "→ボタンが押されました"
# ------------------------------------------------------------------
# 起床時刻は script finish の deep_sleep.enter が毎回決める。
# ここの run_duration と sleep_duration はどちらも保険。
#
# run_duration: script が呼ばれないまま固まったときに必ず眠らせる上限。
#   通常は約15秒、保守モードでも約2分半で script が眠らせるので普段は発火しない。
#   短くすると取得や描画の途中で切られるため、あえて余裕を持たせる。
# sleep_duration: その保険経路で眠るときの時間。until が使えていないので、
#   1時間後に起こして通常の流れをやり直させる。
#
# **緑ボタンはどんなファームを焼いても必ず戻ってこられる入口になる。**
# 新しいファームに不具合があっても、押せば必ず2分の作業窓が開く。
# 保守モードの長さは script finish 側で決めている。
deep_sleep:
  id: sleeper
  run_duration: 5min
  sleep_duration: 1h
  wakeup_pin:
    number: GPIO3
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  # 眠らせる瞬間にボタンが押されていると眠れなくなるため無視させる
  wakeup_pin_mode: IGNORE

# online_image が画像を取りに行くための HTTP クライアント
http_request:
  useragent: esphome/family-calendar
  timeout: 30s
  # 本番で https を使う場合に CA を積まずに済ませるため検証を切る。
  # 配信URLは秘密トークン付きで、内容も家族の予定であるため許容範囲と判断。
  verify_ssl: false

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

online_image:
  - id: calendar_image
    url: ${image_url}
    # トークンはヘッダで送る。クエリ文字列だと URL ごとログに残るため。
    request_headers:
      Authorization: !secret authorization_header
    format: PNG
    # サーバ側で1bitに落としてあるので BINARY で受ける
    type: BINARY
    resize: 800x480
    update_interval: never
    on_download_finished:
      - logger.log: "画像を取得しました。描画します。"
      - component.update: epaper
      - script.execute: finish
    on_error:
      # 取得できなくても眠らせる。画面は前回の内容が残る（ePaper なので消えない）。
      - logger.log: "画像の取得に失敗しました。"
      - script.execute: finish

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # 描画は画像取得後に明示的に行う
    update_interval: never
    lambda: |-
      // 描画色と背景色を入れ替えて渡す。
      // サーバは「白地に黒文字」の人間が読める向きで PNG を出しており、
      // 1bit パレットPNG のどちらのインデックスをインクとみなすかが
      // ePaper ドライバ側と一致しないため、ここで吸収する。
      // サーバ側を negate すると shots の出力や印刷用の画像まで
      // 白黒反転してしまうので、機器の都合は表示側で引き受ける。
      it.image(0, 0, id(calendar_image), COLOR_OFF, COLOR_ON);
