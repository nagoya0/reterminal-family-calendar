# ファームウェア配信専用の Worker。画像側とは意図的に分けてある（src/index.js の冒頭参照）。
#
# **毎日の画像デプロイはこの Worker に触れない。** ファームウェアを更新したいときだけ
# 手元から deploy する。GitHub Actions は worker/ の方だけを対象にしている。
name = "family-calendar-fw"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true
# 版ごとのプレビュー URL を作らせない。認証は効くが、到達できるホスト名を
# 無用に増やす理由がない。
preview_urls = false

# Workers Logs。実家設置後、端末が生きているかを後から確認する手段として
# 有効化する（無料枠: 1日あたり約20万イベント、保持3日間）。
#
# [observability] だけの旧い書き方だと persist が明示されず、デプロイの
# たびにダッシュボード側の設定が消えて見える現象があったため、ダッシュボード
# が提示する完全な形（logs/traces を明示、persist も明示）に揃えた。
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# バイナリは静的アセットとして置く。直接は公開せず、認証を通してから
# Worker が env.ASSETS 経由で読み出す。
[assets]
directory = "public"
binding = "ASSETS"

# 認証情報は wrangler secret put FW_USER / FW_PASSWORD で設定する（コードに置かない）。
# 配信中のバイナリのビルド時刻と MD5 は deploy のたびに変わるので、
# npm run push-firmware が --var で渡す。
