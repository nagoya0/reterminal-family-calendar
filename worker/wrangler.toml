# 画像そのものを Worker のスクリプトに埋め込んで配信する。
# PNG が約3KB しかないため、R2 や KV のようなストレージを介する必要がない。
# 依存サービスが減るぶん障害点も減る。
name = "family-calendar"
main = "src/index.js"
compatibility_date = "2026-08-30"
workers_dev = true
# 版ごとのプレビュー URL を作らせない。認証は効くが、到達できるホスト名を
# 無用に増やす理由がない。
preview_urls = false

# Workers Logs。実家設置後、端末が生きているかを後から確認する手段として
# 有効化する（無料枠: 1日あたり約20万イベント、保持3日間。この用途では
# 直近数日のトラブルシュートに使う。長期の傾向はダッシュボードの
# Analytics グラフの方を見る）。
#
# [observability] だけの旧い書き方だと persist が明示されず、デプロイの
# たびにダッシュボード側の設定が消えて見える現象があったため、ダッシュボード
# が提示する完全な形（logs/traces を明示、persist も明示）に揃えた。
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# 秘密トークンは wrangler secret put ACCESS_TOKEN で設定する（コードに置かない）
